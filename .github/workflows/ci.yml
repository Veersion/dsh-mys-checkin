name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No dependencies: the plugin uses Node built-ins only.
      - name: Protocol / signature
        run: node test/protocol.test.mjs

      - name: Scheduler
        run: node test/schedule.test.mjs

      - name: QR encoder
        run: node test/qr.test.mjs

      - name: Service end-to-end (fake API)
        run: node test/service.test.mjs
